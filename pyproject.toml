[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orthography2ipa"
dynamic = ["version"]
dependencies = ["numpy", "langcodes", "linguatag>=0.1.1a1"]
description = "Linguistically motivated grapheme-to-IPA and allophone mappings for thousands of languages, dialects and historical stages"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["ipa", "phonetics", "phonology", "grapheme", "allophone", "linguistics", "nlp"]

[tool.setuptools.dynamic]
version = {attr = "orthography2ipa.version.VERSION_STR"}

[project.optional-dependencies]
hf = ["huggingface_hub"]
# Residual lexicons, found through the orthography2ipa.lexicons entry points.
# Installing this extra changes no output: the caller reads one with
# packaged_lexicon() and passes it in a Pipeline.
lexicons = ["o2i-lexicons>=0.1.0a1"]
validation = ["pydantic>=2"]
# A real Portuguese syllabifier. Optional: the bundled splitter is correct on its
# own (pt-PT declares its diphthongs). Installing this extra changes no output:
# the caller passes SilabificadorSyllabifier() in a Pipeline.
portuguese = ["silabificador>=2.1.0a1"]
# The tests that pass SilabificadorSyllabifier to an engine need silabificador.
# rarfile reads the CoRuSS dictionaries, which the corpus publishes only as a
# RAR archive. It needs an extraction backend on PATH, and in practice that
# means unrar or unar: the bsdtar backend truncates its read of this archive,
# so a host carrying only bsdtar counts as having none. Without one the CoRuSS
# loader raises, build_scoreboard skips that row and the archive-backed tests
# skip, exactly as the cmudict row does when scriptconv is absent. The CI
# workflows install unar so the ru rows and the en-US/cmudict row are gated
# there and not only on a developer's box.
test = ["pytest", "pytest-timeout", "pytest-cov", "pydantic>=2", "hypothesis",
        "silabificador>=2.1.0a1", "huggingface_hub", "rarfile", "scriptconv",
        "anthropic>=2.6.0"]
# dev-only extra for scripts/compare_systems.py; never a runtime dependency.
# africa-g2p is published on PyPI but is not listed here. Install it into the
# run environment before regenerating the comparison table, as
# scripts/compare_systems.py's module docstring says.
compare = ["epitran", "gruut", "pycotovia", "ahotts-g2p"]
# dev-only extra for scripts/correct_silver_ipa.py, which corrects the
# LLM-generated silver sets with Claude; never a runtime dependency. The test
# extra also lists the SDK, because some tests map its real error classes.
silver-correction = ["anthropic>=2.6.0"]

[project.urls]
Homepage = "https://github.com/TigreGotico/orthography2ipa"
Issues = "https://github.com/TigreGotico/orthography2ipa/issues"

[project.scripts]
orthography2ipa = "orthography2ipa.cli:main"

[tool.setuptools.packages.find]
include = ["orthography2ipa*"]

[tool.setuptools.package-data]
"orthography2ipa" = ["data/*.json", "data/SCHEMA.md"]

# pytest reads this table whether it runs from the repository root or from
# tests/, so every run turns an unknown variant subtag warning into an error.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "linguistic: marks linguistically-critical spot checks",
]
filterwarnings = [
    "error:unknown variant subtag:UserWarning",
]
