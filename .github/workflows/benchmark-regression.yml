name: Benchmark Regression

# Plain repo-specific CI (not a gh-automations reusable workflow) — the
# regression gate is specific to this repo's benchmark harness and gold
# datasets, so it stays local rather than living in the shared library.

on:
  pull_request:
    branches: [dev]
    paths:
      - "orthography2ipa/**"
      - "scripts/benchmark.py"
      - "scripts/check_benchmark_regression.py"
      - "scripts/check_board_not_reverting.py"
      - "scripts/check_board_row_counts.py"
      - "scripts/check_board_freshness.py"
      - "benchmarks/results.json"
      - "benchmarks/results_ci_sample.json"
      - "docs/evaluation/generated/scoreboard.md"
      - "tests/data/**"
      # The burn-down list the same guard ratchets; without it here, a pull
      # request that only edits that file never reaches the check.
      - "tests/test_sources.py"
      - "tests/test_docs_prose.py"
      - ".github/workflows/benchmark-regression.yml"
  workflow_dispatch: {}

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      # rarfile needs an extraction backend on PATH for the CoRuSS gold; the
      # runner's bsdtar truncates that archive, so unar is installed
      # explicitly (see the `test` extra in pyproject.toml).
      - name: Install a RAR extraction backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unar

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[test]"

      - name: Check benchmark regression
        # Measure the checkout (PYTHONPATH=$PWD), not any installed
        # package — same gotcha as scripts/benchmark.py --scoreboard.
        #
        # The PUBLISHED scoreboard (benchmarks/results.json) is FULL-dataset
        # and far too slow to re-run here. This gate instead re-scores at a
        # fixed UNIFORM sample (benchmark.CI_SAMPLE_LIMIT, same cap for every
        # language) and compares against benchmarks/results_ci_sample.json,
        # a baseline committed at that identical cap — so both sides are
        # sliced the same way and there is never a mixed-slice comparison.
        # Refresh that sample file (scripts/benchmark.py --ci-sample)
        # whenever the full scoreboard is regenerated.
        #
        # This job only reliably gates the self-contained gold datasets:
        # wikipron, mirandese and ipadict fetch their TSVs directly over
        # plain HTTP (stdlib urllib, no credentials), and ep_dialects is
        # bundled in tests/data/. cmudict (needs the TigreGotico-internal
        # `scriptconv` package) is not installed here;
        # scripts/benchmark.py's build_scoreboard() already catches its
        # ImportError and skips it, and check_benchmark_regression.py
        # treats a baseline row that wasn't reproduced this run as
        # "missing" (noted, not a regression) rather than failing the
        # job. That dataset is effectively best-effort/manual until its
        # loader is made CI-installable.
        #
        # epsilon=0.005 (absolute PER worsening) is the default: tight
        # enough to catch a real grapheme/allophone regression, loose
        # enough to absorb harness-level float noise between runs.
        run: |
          PYTHONPATH=$PWD .venv/bin/python scripts/check_benchmark_regression.py --epsilon 0.005

      - name: Check board row counts (stale-row guard)
        # Fails the build on a row scoring more words than its loader
        # currently yields (see scripts/check_board_row_counts.py's
        # docstring for the vox_communis spn incident this exists to
        # catch). Rows whose gold could not be fetched here — a live
        # snapshot needs network, or an optional package like `rarfile`
        # is missing on this runner — are reported and skipped rather
        # than failing the job, matching check_board_row_counts.py's own
        # OSError/ImportError bucketing.
        run: |
          PYTHONPATH=$PWD .venv/bin/python scripts/check_board_row_counts.py

  # The board-freshness guard runs in three jobs. The plan job lists every
  # board row a touched spec owns and splits them into shards balanced by
  # word count. One shard job per shard measures its rows in parallel. The
  # board-freshness job reads every shard's results and gives the verdict:
  # a planned row with no result fails it, so a shard that crashed, timed
  # out or never ran cannot read as a pass. An edit to a clade spec owns
  # hundreds of rows (iir.json and its siblings owned 178 rows in each board
  # file, about 2.7 million word pairs), which one job cannot measure inside
  # its time limit; the shards keep every one of those rows measured.
  board-freshness-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      # Needs origin/dev reachable to diff against, and enough history to
      # find the merge base -- same reason board-not-reverting below fetches
      # unshallow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[test]"

      - name: Plan the rows the touched specs own
        id: plan
        run: |
          git fetch --no-tags origin dev
          PYTHONPATH=$PWD .venv/bin/python scripts/check_board_freshness.py \
            --base origin/dev --plan-out board-freshness-plan.json
          echo "shards=$(jq -c '[range(.shards)]' board-freshness-plan.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: board-freshness-plan
          path: board-freshness-plan.json
          if-no-files-found: error

  board-freshness-shard:
    needs: board-freshness-plan
    if: needs.board-freshness-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # A shard is planned at about 15 minutes on a hosted runner; the cap on
    # the shard count keeps even a whole-board plan under 25. The limit
    # still lets a genuine hang fail the build instead of tying up a runner
    # for the 360-minute platform default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.board-freshness-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      # rarfile needs an extraction backend on PATH for the CoRuSS gold; the
      # runner's bsdtar truncates that archive, so unar is installed
      # explicitly (see the `test` extra in pyproject.toml).
      - name: Install a RAR extraction backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unar

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[test]"

      - uses: actions/download-artifact@v8
        with:
          name: board-freshness-plan

      - name: Measure this shard's rows
        # Rescores against the FULL committed board, not the CI sample. A
        # dataset whose gold cannot be fetched here is reported and
        # skipped, never silently passed.
        run: |
          mkdir -p board-freshness-results
          PYTHONPATH=$PWD .venv/bin/python scripts/check_board_freshness.py \
            --plan board-freshness-plan.json --shard ${{ matrix.shard }} \
            --results-out board-freshness-results/shard-${{ matrix.shard }}.json

      # Uploaded when the shard found a stale row too, so the verdict job
      # names it; a shard that wrote nothing leaves its rows unverified.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: board-freshness-result-${{ matrix.shard }}
          path: board-freshness-results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  board-freshness:
    needs: [board-freshness-plan, board-freshness-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[test]"

      - uses: actions/download-artifact@v8
        with:
          name: board-freshness-plan

      # No result artifact exists when the plan owns no row; the verdict
      # step below fails on any planned row that has no result.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: board-freshness-result-*
          path: board-freshness-results
          merge-multiple: true

      - name: Check the board matches what touched specs now produce
        run: |
          PYTHONPATH=$PWD .venv/bin/python scripts/check_board_freshness.py \
            --plan board-freshness-plan.json --aggregate board-freshness-results

  board-not-reverting:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The PR HEAD, not the merge ref: the check performs the merge itself
      # and reads the result, and doing so needs both sides plus enough of
      # the base branch's history to recognise a value it already moved past.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only so the check can resolve a board language tag to its spec
        # the way the harness does — `de` is scored against `de-DE.json`.
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e "."

      - name: Check the board and the burn-down lists do not carry dev backwards
        # A branch that merges dev and resolves the conflicted board file by
        # keeping its own copy puts back the numbers dev measured after the
        # branch was cut, with both sides green throughout — see the script's
        # docstring and AGENTS.md ("Never carry the board backwards").
        # Run the BASE branch's copy of the script, not the head's: the head
        # was checked out above so the merge has both sides, but a branch
        # cut before this script existed (or one that edited it) must not
        # get to supply, weaken, or omit the guard that judges it.
        # The Board-Rows line is read from the live PR body, not the event
        # payload, so a re-run after a body edit sees the edited declaration.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json body -q .body)"
          export PR_BODY
          git fetch --no-tags origin ${{ github.base_ref }}
          git show origin/${{ github.base_ref }}:scripts/check_board_not_reverting.py > "${RUNNER_TEMP}/check_board_not_reverting.py"
          PYTHONPATH=$PWD .venv/bin/python "${RUNNER_TEMP}/check_board_not_reverting.py" \
            --base origin/${{ github.base_ref }}
