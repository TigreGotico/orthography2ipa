# auto add labels to PRs
on:
  pull_request_target:
    types: [ opened, edited ]
name: conventional-release-labels
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: bcoe/conventional-release-labels@v1