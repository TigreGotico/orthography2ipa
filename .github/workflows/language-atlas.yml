name: Language Atlas

# The atlas blocks print engine output, board scores and linguatag data. A
# spec, an engine, a board or a linguatag release can make a language page
# stale, and a linguatag release can do it with no change in this repository.
# So the check runs here, in a job that no other job depends on, and not in
# Build Tests, Code Coverage or Docs Prose. Keep this job out of the required
# checks of the branch.
#
# On a push to dev, on the schedule and on a manual run, the regenerate job
# rewrites the atlas and opens one pull request with the change.

on:
  pull_request:
    branches: [dev]
    paths:
      - "docs/languages/**"
      - "scripts/gen_language_atlas.py"
      - "scripts/atlas_snapshot.json"
      - "benchmarks/results.json"
      - "docs/evaluation/datasets.md"
      - "tests/test_language_atlas.py"
      - "orthography2ipa/**"
      - "pyproject.toml"
      - ".github/workflows/language-atlas.yml"
  push:
    branches: [dev]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]"

      - name: Check the language atlas
        run: |
          PYTHONPATH=$PWD .venv/bin/python scripts/gen_language_atlas.py --check
          PYTHONPATH=$PWD .venv/bin/python -m pytest -q tests/test_language_atlas.py

  regenerate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]"

      - name: Regenerate the language atlas
        run: |
          PYTHONPATH=$PWD .venv/bin/python scripts/gen_language_atlas.py --write
          git status --short

      # A pull request that GITHUB_TOKEN opens starts no workflow run. Close
      # and reopen it, or push to its branch, to run the checks.
      - name: Open the regenerate pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/regenerate-language-atlas
          base: dev
          delete-branch: true
          commit-message: "docs: regenerate the language atlas"
          title: "docs: regenerate the language atlas"
          body: |
            The language atlas on dev is stale. This pull request holds the
            output of `scripts/gen_language_atlas.py --write` on the dev tip.
            The Language Atlas workflow opened it.
