name: Downstream Smoke

# Plain repo-specific CI (not a gh-automations reusable workflow). The engine's
# data is gated heavily and its consumers are not gated at all, so a removed
# module, a renamed class or a changed data file can break every downstream G2P
# package while this repo's own suite stays green. Each cell checks out one
# consumer at its default branch, installs it with its test extra, installs this
# checkout over it, and runs the consumer's own suite. There is no path filter:
# nearly every change reaches a contract surface, and a filter that misses one
# is the failure this job exists to catch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-suite:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One broken consumer must not hide the state of the others.
      fail-fast: false
      matrix:
        # udarnik, markovphone and pycotovia-ng consume the engine too but are
        # not in the matrix yet.
        package:
          - arbtok
          - tugaphone
          - euskaphone
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the consumer
        uses: actions/checkout@v7
        with:
          repository: TigreGotico/${{ matrix.package }}
          path: consumer

      - name: Install espeak-ng
        # arbtok's suite compares its output with espeak-ng's.
        run: sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the consumer, then this engine over it
        # The consumer goes first so its own floor pin resolves normally; the
        # second install replaces the released engine with the checkout under
        # test, which is the whole point of the job.
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --prerelease=allow -e "./consumer[test]"
          uv pip install --python .venv/bin/python --prerelease=allow --reinstall-package orthography2ipa .

      - name: Import and transcribe
        run: .venv/bin/python scripts/smoke_downstream.py ${{ matrix.package }}

      - name: Run the consumer's tests
        working-directory: consumer
        run: |
          ../.venv/bin/python -I -c "import orthography2ipa; print(orthography2ipa.__file__)"
          ../.venv/bin/python -m pytest tests
